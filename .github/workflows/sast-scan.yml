name: sast-scan
on:
  push:
    branches: [githubcicd]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project dependencies
        run: npm ci --force

      - name: Download OWASP Dependency-Check
        run: |
          curl -fsSL https://github.com/dependency-check/DependencyCheck/releases/download/v13.0.0/dependency-check-13.0.0-release.zip -o "$RUNNER_TEMP/dependency-check.zip"
          unzip -q "$RUNNER_TEMP/dependency-check.zip" -d "$RUNNER_TEMP"

      - name: Run dependency scan
        run: |
          "$RUNNER_TEMP/dependency-check/bin/dependency-check.sh" \
            --project bitcoin \
            --nvdDatafeed 'https://open-vulnerability-data-mirror-production.up.railway.app/nvdcve-{0}.json.gz' \
            --scan . \
            --format HTML \
            --out . \
            --disableOssIndex

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: dependency-check-report.html
          if-no-files-found: error
